# This config was automatically generated from your source code
# Stacks detected: cicd:github-actions:.github/workflows,deps:node:.,deps:rust:.,package_manager:yarn:
version: 2.1
jobs:
  test-rust:
    docker:
      - image: cimg/rust:1.87.0
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          key: cargo-{{ checksum "Cargo.lock" }}
      - run:
          name: check-format
          command: cargo fmt --check

        # Restore all caches
      - restore_cache:
          keys:
            - cargo-deps-{{ checksum "Cargo.lock" }}
            - sys-deps-{{ checksum "Cargo.lock" }}
            - wasm-tools-v0.2.87
            - rustup-components-{{ checksum "Cargo.lock" }}
      
      # Install Rust components
      - run:
          name: Install nightly rustfmt
          command: |
            if [ ! -d ~/.rustup/toolchains/nightly-x86_64-unknown-linux-gnu ]; then
              rustup toolchain install nightly --component rustfmt --no-self-update
              rustup set profile minimal
            fi
      
      # Install system dependencies (protobuf)
      - run:
          name: Install system dependencies
          command: |
            if ! command -v protoc &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y protobuf-compiler
              sudo apt-get clean
            fi
      
      # Install wasm-bindgen-cli
      - run:
          name: Install wasm tools
          command: |
            if ! command -v wasm-bindgen &> /dev/null || \
               [ "$(wasm-bindgen --version | cut -d' ' -f2)" != "0.2.87" ]; then
              cargo install wasm-bindgen-cli --version 0.2.87 --locked
            fi
      
      # Save all caches
      - save_cache:
          key: rustup-components-{{ checksum ".circleci/setup-rust.sh" }}
          paths:
            - ~/.rustup/toolchains/nightly-x86_64-unknown-linux-gnu
            - ~/.rustup/settings.toml
      
      - save_cache:
          key: sys-deps-{{ checksum "Cargo.lock" }}
          paths:
            - /usr/bin/protoc
            - /usr/include/google/protobuf
      
      - save_cache:
          key: wasm-tools-v0.2.87
          paths:
            - /usr/local/cargo/bin/wasm-bindgen*
            - /usr/local/cargo/.crates*
      
      - save_cache:
          key: cargo-deps-{{ checksum "Cargo.lock" }}
          paths:
            - /usr/local/cargo/registry
            - /usr/local/cargo/git
            - target

      - run:
          name: test-shared
          command: cargo test -p shared
      - run:
          name: test-mesic
          command: cargo test -p mesic
      - run:
          name: test-state
          command: cargo test -p state
      - run:
          name: test-xeric
          command: cargo test -p xeric
      - run:
          name: verify-hydric-build
          command: ./hydric/build.py
      - save_cache:
          key: cargo-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo
workflows:
  build-and-test:
    jobs:
      - test-rust
