version: 2.1
jobs:
  test-rust:
    docker:
      - image: cimg/rust:1.87.0
    steps:
      - checkout
      - restore_cache:
          key: cargo-{{ checksum "Cargo.lock" }}
      - run:
          name: check-format
          command: cargo fmt --check
      - run:
          name: test-shared
          command: cargo test -p shared
      - run:
          name: test-mesic
          command: cargo test -p mesic
      - run:
          name: test-state
          command: cargo test -p state
      - run:
          name: test-xeric
          command: cargo test -p xeric
