# Stacks detected: cicd:github-actions:.github/workflows,deps:node:.,deps:rust:.,package_manager:yarn:
version: 2.1
jobs:
  test-rust:
    docker:
      - image: cimg/rust:1.87.0
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          key: cargo-{{ checksum "Cargo.lock" }}
      - run:
          name: check-format
          command: cargo fmt --check
      - run:
          name: test-shared
          command: |
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
            cargo test -p shared
      - run:
          name: test-mesic
          command: cargo test -p mesic
      - run:
          name: test-state
          command: cargo test -p state
      - run:
          name: test-xeric
          command: cargo test -p xeric
      - run:
          name: verify-hydric-build
          command: |
            rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
            cargo install wasm-bindgen-cli
            ./hydric/build.py
      - save_cache:
          key: cargo-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo
workflows:
  build-and-test:
    jobs:
      - test-rust
