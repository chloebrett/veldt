syntax = "proto3";

package render;

import "pmodel.proto";

service Render {
  rpc Render (RenderRequest) returns (RenderReply) {}
}

message RenderRequest {
  pmodel.TrackProto track = 1;
  repeated pmodel.EffectInstanceProto effects = 2;
  pmodel.GeneratorInstanceProto generator = 3;
  float bpm = 4;
}

message RenderReply {
  bytes audio = 1;
}
