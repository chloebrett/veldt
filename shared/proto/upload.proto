syntax = "proto3";
package upload;

service Upload {
    rpc UploadSample (stream UploadChunkRequest) returns (UploadSampleReply){}
}

message UploadChunkRequest {
    string file_name = 1;
    bytes chunk_data = 2;
    uint32 chunk_index = 3;
    uint32 total_chunks = 4;
}

message UploadSampleReply {
    bool success = 1;
}
