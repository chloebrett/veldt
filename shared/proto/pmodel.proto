syntax = "proto3";

package pmodel;

message ProjectProto {
  string name = 1;

  repeated TrackProto tracks = 2;

  /// Ordered based on start_position.
  repeated TrackPlacementProto track_placements = 3;

  repeated SampleProto samples = 4;

  repeated GeneratorInstanceProto generators = 5;

  repeated MixerChannelProto mixer = 6;

  float bpm = 7;
}

message TrackProto {
  repeated PlacedNoteProto notes = 1;
}

message TrackPlacementProto {
  uint32 track_id = 1;

  float start_position = 2;

  optional float clipped_duration = 3;

  uint32 visual_placement = 4;
}

message SampleProto {
  bytes data = 1;

  float sample_rate = 2;

  uint32 bit_depth = 3;
}

message MixerChannelProto {
  repeated EffectInstanceProto effects = 1;
}

message PlacedNoteProto {
  NoteProto note = 1;

  float offset = 2;
}

message NoteProto {
  PitchNameProto pitch_name = 1;

  float beats = 2;
}

message AdsrEnvelopeProto {
  float attack = 1;

  float decay = 2;

  float sustain = 3;

  float release = 4;
}

message PitchNameProto {
  ScaleValueProto scale_value = 1;

  int32 octave = 2;
}

message EffectInstanceProto {
  EffectMetaProto meta = 1;

  oneof effect {
    SimpleDelayProto simple_delay = 2;

    SimpleEqProto simple_eq = 3;

    SimpleCompressorProto simple_compressor = 4;
  }

}

message GeneratorInstanceProto {
  uint32 id = 1;

  GeneratorMetaProto meta = 2;

  oneof kind {
    SimpleWaveProto simple_wave = 3;
  };

}

message GeneratorMetaProto {
  float volume = 1;
}

message SimpleWaveProto {
  SimpleWaveConfigProto config = 1;
}

message SimpleWaveConfigProto {
  WaveTypeProto wave = 1;

  AdsrEnvelopeProto envelope = 2;

  uint32 osc_count = 3;

  float detune_cents = 4;
}

message EffectMetaProto {
  uint32 id = 1;

  float wet = 2;
}

message SimpleDelayProto {
  DelayConfigProto config = 1;
}

message DelayConfigProto {
  float amplitude = 1;

  float delay_ms = 2;
}

message SimpleEqProto {
  EqConfigProto config = 1;
}

message EqConfigProto {
  EqTypeProto kind = 1;

  float fc = 2;

  float q = 3;
}

message SimpleCompressorProto {
  CompressorConfigProto config = 1;
}

message CompressorConfigProto {
  float threshold = 1;

  float attack = 2;

  float release = 3;

  float ratio = 4;

  float gain = 5;
}

enum WaveTypeProto {
  Unknown = 0;
  Sine = 1;
  Square = 2;
  Saw = 3;
  Triangle = 4;
}

enum ScaleValueProto {
  UnknownScaleValue = 0;
  AScaleValue = 1;
  ASharpScaleValue = 2;
  BScaleValue = 3;
  CScaleValue = 4;
  CSharpScaleValue = 5;
  DScaleValue = 6;
  DSharpScaleValue = 7;
  EScaleValue = 8;
  FScaleValue = 9;
  FSharpScaleValue = 10;
  GScaleValue = 11;
  GSharpScaleValue = 12;
}

enum ScaleProto {
  UnknownScale = 0;
  ChromaticScale = 1;
  MajorScale = 2;
  HarmonicMinorScale = 3;
  NaturalMinorScale = 4;
  PentatonicScale = 5;
}

enum EqTypeProto {
  UnknownEq = 0;
  SimpleResonatorEq = 1;
  SmithAngellResonatorEq = 2;
  SimpleFirstOrderLowPassEq = 3;
  SimpleFirstOrderHighPassEq = 4;
  SimpleSecondOrderLowPassEq = 5;
  SimpleSecondOrderHighPassEq = 6;
  SimpleSecondOrderResonatorEq = 7;
  SimpleSecondOrderBandStopEq = 8;
  ButterworthLowPassEq = 9;
  ButterworthHighPassEq = 10;
  ButterworthResonatorEq = 11;
  ButterworthBandStopEq = 12;
  FirstOrderAllPassEq = 13;
  SecondOrderAllPassEq = 14;
}
