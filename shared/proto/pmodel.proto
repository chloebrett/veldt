syntax = "proto3";

package pmodel;

message ProjectProto {
  string name = 1;

  repeated TrackProto tracks = 2;

  /// Ordered based on start_position.
  repeated TrackPlacementProto track_placements = 3;

  repeated SampleProto samples = 4;

  repeated GeneratorInstanceProto generators = 5;

  repeated MixerChannelProto mixer = 6;

  float bpm = 7;
}

message TrackProto {
  repeated PlacedNoteProto notes = 1;
}

message TrackPlacementProto {
  uint32 track_id = 1;

  float offset = 2;

  optional float clipped_duration = 3;

  uint32 visual_placement = 4;
}

message SampleProto {
  bytes data = 1;

  float sample_rate = 2;
}

message MixerChannelProto {
  repeated EffectInstanceProto effects = 1;
}

message PlacedNoteProto {
  NoteProto note = 1;

  float offset = 2;
}

message NoteProto {
  PitchNameProto pitch_name = 1;

  float beats = 2;
}

message AdsrEnvelopeProto {
  float attack = 1;

  float decay = 2;

  float sustain = 3;

  float release = 4;
}

message PitchNameProto {
  ScaleValueProto scale_value = 1;

  int32 octave = 2;
}

message EffectInstanceProto {
  EffectMetaProto meta = 1;

  oneof effect {
    SimpleDelayProto simple_delay = 2;

    SimpleEqProto simple_eq = 3;

    SimpleCompressorProto simple_compressor = 4;
  }

}

message GeneratorInstanceProto {
  uint32 id = 1;

  GeneratorMetaProto meta = 2;

  oneof kind {
    SimpleWaveProto simple_wave = 3;
  };
}

message GeneratorMetaProto {
  float volume = 1;
}

message SimpleWaveProto {
  SimpleWaveConfigProto config = 1;
}

message SimpleWaveConfigProto {
  WaveTypeProto wave = 1;

  AdsrEnvelopeProto envelope = 2;

  uint32 osc_count = 3;

  float detune_cents = 4;

  AntiAliasingModeProto anti_aliasing_mode = 5;

  uint32 oversample_factor = 6;
}

message EffectMetaProto {
  uint32 id = 1;

  float wet = 2;
}

message SimpleDelayProto {
  DelayConfigProto config = 1;
}

message DelayConfigProto {
  float delay_ms = 2;
}

message SimpleEqProto {
  EqConfigProto config = 1;
}

message EqConfigProto {
  EqTypeProto kind = 1;

  float fc = 2;

  float q = 3;

  float gain = 4;
}

message SimpleCompressorProto {
  CompressorConfigProto config = 1;
}

message CompressorConfigProto {
  float threshold = 1;

  float attack_ms = 2;

  float release_ms = 3;

  float ratio = 4;

  float gain = 5;
}

enum WaveTypeProto {
  UnknownWaveType = 0;
  SineWaveType = 1;
  SquareWaveType = 2;
  SawWaveType = 3;
  TriangleWaveType = 4;
}

enum AntiAliasingModeProto {
  UnknownAntiAliasingMode = 0;
  OffAntiAliasingMode = 1;
  OversampleAntiAliasingMode = 2;
  AdditiveAntiAliasingMode = 3;
}

enum ScaleValueProto {
  UnknownScaleValue = 0;
  CScaleValue = 1;
  CSharpScaleValue = 2;
  DScaleValue = 3;
  DSharpScaleValue = 4;
  EScaleValue = 5;
  FScaleValue = 6;
  FSharpScaleValue = 7;
  GScaleValue = 8;
  GSharpScaleValue = 9;
  AScaleValue = 10;
  ASharpScaleValue = 11;
  BScaleValue = 12;
}

enum ScaleProto {
  UnknownScale = 0;
  ChromaticScale = 1;
  MajorScale = 2;
  HarmonicMinorScale = 3;
  NaturalMinorScale = 4;
  PentatonicScale = 5;
}

enum EqTypeProto {
  UnknownEqType = 0;
  SimpleResonatorEqType = 1;
  SmithAngellResonatorEqType = 2;
  SimpleFirstOrderLowPassEqType = 3;
  SimpleFirstOrderHighPassEqType = 4;
  SimpleSecondOrderLowPassEqType = 5;
  SimpleSecondOrderHighPassEqType = 6;
  SimpleSecondOrderResonatorEqType = 7;
  SimpleSecondOrderBandStopEqType = 8;
  ButterworthLowPassEqType = 9;
  ButterworthHighPassEqType = 10;
  ButterworthResonatorEqType = 11;
  ButterworthBandStopEqType = 12;
  FirstOrderAllPassEqType = 13;
  SecondOrderAllPassEqType = 14;
  LinkwitzRileySecondOrderLowPassEqType = 15;
  LinkwitzRileySecondOrderHighPassEqType = 16;
  ParametricSecondOrderNonConstantQEqType = 17;
}
