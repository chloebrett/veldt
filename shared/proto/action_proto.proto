syntax = "proto3";

package action_proto;

import "pmodel.proto";

message ActionProto {
  oneof kind {
    pmodel.ScaleValueProto set_key = 1;
    pmodel.ScaleProto set_scale = 2;
    string set_project_name = 3;
    bool set_mute = 4;
    uint32 delete_note = 5;
    pmodel.PlacedNoteProto add_note = 6;
    pmodel.ScaleValueProto set_scale_value = 7;
    pmodel.WaveTypeProto set_wave = 8;
    pmodel.AdsrEnvelopeProto set_envelope = 10;
    pmodel.AntiAliasingModeProto set_anti_aliasing_mode = 11;
    int32 set_octave = 12;
    pmodel.PitchNameProto set_pitch_name = 13;
    uint32 move_effect_up = 15;
    uint32 move_effect_down = 16;
    uint32 delete_effect = 17;
    // Note: this (EffectInstanceProto) might be the largest variant here.
    // Check if this means that every action sent over the wire is this large.
    // If so, maybe consider storing an optional field for large payloads instead (assuming that even helps).
    pmodel.EffectInstanceProto add_effect = 18;
    pmodel.TrackPlacementProto add_track_placement = 23;
    uint32 delete_track_placement = 24;
    pmodel.EqTypeProto set_eq_kind = 25;
    pmodel.FloatOptionProto set_clipped_duration = 26;
    pmodel.TrackProto add_track = 27;
    uint32 delete_track = 28;
    SetFloatProto set_float = 29;
    SetUintProto set_uint = 30;
  }
}

message SetFloatProto {
  string key = 1;
  float value = 2;
}

message SetUintProto {
  string key = 1;
  uint32 value = 2;
}

message ReversibleActionProto {
  ActionProto forward = 1;
  ActionProto reverse = 2;
  SelectorProto selector = 3;
  bool is_compacted = 4; // TODO: what to do about this? Don't send over the wire?
}

message SelectorProto {
  oneof kind {
    uint32 root = 1; // dummy value
    uint32 track = 2;
    IndexPair note = 3;
    uint32 mixer = 4;
    IndexPair effect = 5;
    uint32 generator = 6;
    uint32 track_placement = 7;
  }

  message IndexPair {
    uint32 first = 1;
    uint32 second = 2;
  }
}

