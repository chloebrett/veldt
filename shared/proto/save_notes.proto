syntax = "proto3";

package save_notes;

import "pmodel.proto";

service SaveNotes {
  rpc SaveNotes (SaveNotesRequest) returns (SaveNotesReply) {}
}

service LoadNotesList {
  rpc LoadNotesList (LoadNotesListRequest) returns (LoadNotesListReply) {}
}

message SaveNotesRequest {
  string name = 1;
  repeated pmodel.NoteProto notes = 2;
}

message SaveNotesReply {
}

message LoadNotesListRequest {
}

message LoadNotesListReply {
    repeated string names = 1;
}
